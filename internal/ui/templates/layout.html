{{define "layout"}}<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"409|413|422","swap":true,"error":false},{"code":"...","swap":false,"error":true}]}'>
<title>{{.Title}} · Learning Hub</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
<script src="/static/htmx.min.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token":"{{.CSRF}}"}'>
<a class="skip" href="#main">پرش به محتوا</a>
<header><div class="bar"><a href="/topics" class="brand">Learning Hub</a>
  <nav aria-label="ناوبری اصلی"><a href="/topics"{{if eq .Page "topics"}} aria-current="page"{{end}}>موضوعات</a> <a href="/sync"{{if eq .Page "sync"}} aria-current="page"{{end}}>همگام‌سازی</a> <a href="/settings"{{if eq .Page "settings"}} aria-current="page"{{end}}>تنظیمات</a></nav>
  <button type="button" class="theme-toggle" data-theme-toggle title="تغییر تم: خودکار، روشن، تاریک" aria-live="polite">تم: خودکار</button></div></header>
<div id="flash" class="error" role="alert" hidden></div>
<main id="main" tabindex="-1">{{template "content" .}}</main>
<dialog id="shortcuts" aria-labelledby="shortcuts-h">
  <h2 id="shortcuts-h">میان‌برهای صفحه‌کلید</h2>
  <dl><dt><kbd>/</kbd></dt><dd>جست‌وجوی موضوعات</dd><dt><kbd>[</kbd> <kbd>]</kbd></dt><dd>فصل قبل / بعد</dd><dt><kbd>?</kbd></dt><dd>همین راهنما</dd></dl>
  <form method="dialog"><button>بستن</button></form>
</dialog>
</body>
</html>{{end}}
