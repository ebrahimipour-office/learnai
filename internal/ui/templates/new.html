{{define "content"}}
<h1>ورود نقشه راه</h1>
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
{{with .Notice}}<p class="notice" role="status">{{.}}</p>{{end}}
<form method="post" action="/roadmaps/drafts" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <label>فایل Markdown (حداکثر ۱ مگابایت)
    <input type="file" name="file" accept=".md,.markdown,text/markdown" required>
  </label>
  <button type="submit">پیش‌نمایش</button>
</form>
{{end}}
