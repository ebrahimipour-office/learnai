{{define "content"}}
<h1>ورود نقشه راه</h1>
{{with .Error}}<p class="error" role="alert">{{.}}</p>{{end}}
<form method="post" action="/roadmaps/drafts" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{.CSRF}}">
  <label>فایل Markdown (حداکثر ۱ مگابایت)
    <input type="file" name="file" accept=".md,.markdown,text/markdown" required>
  </label>
  {{if .Roadmaps}}<label>مقصد
    <select name="roadmap_id">
      <option value="">نقشه راه جدید</option>
      {{range .Roadmaps}}<option value="{{.ID}}"{{if eq .ID $.RoadmapID}} selected{{end}}>ورود مجدد: {{.Title}}</option>{{end}}
    </select>
  </label>{{end}}
  <button type="submit">پیش‌نمایش</button>
</form>
{{end}}
