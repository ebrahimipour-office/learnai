# LearningHub Configuration File (Example)
# Copy this file to `config.toml` and customize as needed.
# Note: Unknown keys will be rejected by LearningHub. All durations require units (e.g., "10m", "30s").

# Base directory for topics, roadmaps, and .app data.
# When omitted: the current directory only if it already holds app.db or config.toml (older installs,
# with a warning); otherwise the OS data folder — %LOCALAPPDATA%\LearningHub (Windows),
# ~/.local/share/learninghub or $XDG_DATA_HOME/learninghub (Linux), ~/Library/Application Support/LearningHub (macOS).
# Set it to keep the data in one fixed place; never use the source tree or dist/.
# Must be an absolute path if explicitly set.
# base_dir = "D:\\Project3\\learnai"

# Loopback listen address (must strictly bind to 127.0.0.1 or [::1]).
listen = "127.0.0.1:8787"

# UI and prompt language (default: "fa").
language = "fa"

# Log retention in days (minimum 1, default 30).
log_retention_days = 30

# Daily SQLite database backups kept in .app/backup (default 7).
backup_keep = 7

# How long an unconfirmed roadmap import preview lives (default: "24h").
draft_ttl = "24h"

[adapter]
# Initial AI adapter: "antigravity" | "claude" | "codex" | "anthropic" (can also be switched in UI settings).
kind = "antigravity"
binary = "agy"
model = "gemini-3.8-flash-medium"
effort = "medium"        # low | medium | high | xhigh | max
sandbox = true
# skip_permissions passes --dangerously-skip-permissions to agy (requires sandbox = true).
skip_permissions = true
extra_args = []

[adapter.claude]
binary = "claude"
model = ""              # empty uses the tool's own default
effort = ""
extra_args = []

[adapter.codex]
binary = "codex"
model = ""
effort = ""
extra_args = []

# Direct Anthropic API (no CLI). The key is read from the environment only, never from this file:
# api_key_env = "" uses ANTHROPIC_API_KEY (or an `ant auth login` profile); set a name to use another variable.
[adapter.anthropic]
model = "claude-opus-5-5"
effort = "high"          # low | medium | high | xhigh | max
max_tokens = 64000       # 1..128000
api_key_env = ""

[jobs]
# Maximum concurrent background jobs (default 1).
max_concurrent = 1
# Maximum parallel item evaluations (default 1).
evaluate_parallelism = 1
# Timeouts for background jobs (minimum "1s").
timeout_lesson = "10m"
timeout_exercises = "10m"
timeout_evaluate_item = "5m"
timeout_evaluate = "30m"
# Timeout for roadmap chapter analysis / outline detection (default "10m", recommended "15m" for large documents).
timeout_analyze = "15m"
# Stall timeout when AI sends no output (default "6m"; keep below lesson/exercises timeouts).
stall_timeout = "6m"
# Automatic retries of a job that failed with rate_limited or interrupted (default 2; 0 = off).
auto_retry = 2
# Wait before each automatic retry (default "2m", minimum "1s").
retry_delay = "2m"

[evaluation]
# Type-check Go answers with `go vet` before the AI evaluates them (default false). The code is
# never run. Needs the go toolchain on PATH; a snippet, an external import or a timeout is skipped.
compile_check = false
# Limit for one go vet run (default "30s", minimum "1s").
compile_timeout = "30s"
# Run the hidden Go test that exercise generation wrote for each Go exercise against the answer with
# `go test` (default false). This RUNS your answer's code on this machine: in a temp module with a
# closed environment (none of your variables, no module downloads, no cgo), a deadline and the whole
# process tree killed after it. A test that imports anything beyond a fixed safe list, or an answer that
# imports os/exec, net, syscall, unsafe or plugin, is skipped instead of run. Needs go on PATH.
run_tests = false
# Limit for the test binary (default "60s", minimum "1s"); building gets one more minute.
test_timeout = "60s"

[exercises]
count_default = 6
count_min = 3
count_max = 12
allowed_answer_exts = [
    ".go", ".py", ".js", ".ts", ".java", ".c", ".cpp",
    ".rs", ".sql", ".sh", ".md", ".txt", ".json", ".yaml", ".yml"
]

[limits]
max_roadmap_bytes = 1048576  # 1 MB
max_answer_bytes  = 204800   # 200 KB
max_lesson_bytes  = 204800   # 200 KB
max_source_bytes  = 204800   # 200 KB
max_tree_topics   = 200      # maximum topic records created by one tree import

[editor]
# Optional external editor command template (e.g., "code -g {{file}}:{{line}}").
command = ""

# «برای مرور» در صفحه موضوعات: آخرین نمره کمتر از score_below یا آخرین ارزیابی قدیمی‌تر از stale_days روز
[review]
score_below = 70
stale_days = 14
