name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      # -race needs cgo for the test binary only; the shipped build stays CGO_ENABLED=0
      - run: CGO_ENABLED=1 go test -race ./cmd/... ./internal/... ./skills/...
      - run: make lint
      - run: make vuln

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l cmd internal skills)"
      - run: go vet ./cmd/... ./internal/... ./skills/...
      - run: go test ./cmd/... ./internal/... ./skills/...
